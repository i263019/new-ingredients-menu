<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Berry Smoothie Recipe</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <article class="recipe-card">
        <h1>Recipe Card for Berry Smoothie</h1>
        
        <div class="recipe-image-placeholder">
            Picture of a berry smoothie
        </div>

        <ul class="ingredients-list">
            <li>Mixed frozen berries</li>
            <li>Greek yogurt</li>
            <li>Almond milk</li>
            <li>Honey</li>
        </ul>

        <h2>Timer=5mins</h2>

        <h3>Nutrient labels</h3>
        <div class="nutrient-grid">
            <h4>Total fats 2g</h4>
            <h4>Total sugar 28g</h4>
            <h4>Total sodium 0.1g</h4>
        </div>

        <a href="#substitutions" class="substitution-link">click here to know about substitutions</a>
    </article>

</body>
</html>
